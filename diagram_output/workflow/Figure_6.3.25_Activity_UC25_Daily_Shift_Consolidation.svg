="70.768" fill="#F1F5F9" style="stroke:#1F3A5F;stroke-width:2.708;" rx="8.333" ry="8.333"/><text x="1607.83" y="1491.442" fill="#1E293B" font-size="25" textLength="511.218" font-family="'Segoe UI'">9b. Set flag is_fallback_generated = true</text><rect x="1057.525" y="1630.671" width="775.382" height="70.768" fill="#F1F5F9" style="stroke:#1F3A5F;stroke-width:2.708;" rx="8.333" ry="8.333"/><text x="1078.358" y="1674.71" fill="#1E293B" font-size="25" textLength="733.716" font-family="'Segoe UI'">10. Persist summary record in shift_daily_summaries table</text><rect x="996.935" y="1743.106" width="896.562" height="70.768" fill="#F1F5F9" style="stroke:#1F3A5F;stroke-width:2.708;" rx="8.333" ry="8.333"/><text x="1017.768" y="1787.145" fill="#1E293B" font-size="25" textLength="854.895" font-family="'Segoe UI'">11. Publish Daily Shift Summary to Executive &amp; Manager Dashboard</text><ellipse cx="1445.216" cy="1878.458" rx="22.917" ry="22.917" fill="none" style="stroke:#222;stroke-width:2.083;"/><ellipse cx="1445.216" cy="1878.458" rx="12.5" ry="12.5" fill="#222" style="stroke:#222;stroke-width:2.083;"/><line x1="686.662" y1="114.639" x2="686.662" y2="1901.374" style="stroke:#64748B;stroke-width:3.125;"/><polygon points="2852.127,931.127,3342.422,931.127,3367.422,956.127,3342.422,981.127,2852.127,981.127,2827.127,956.127,2852.127,931.127" fill="#EAF2FF" style="stroke:#3B82F6;stroke-width:2.708;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="2852.127" y="964.782" fill="#1F3A5F" font-size="25" textLength="490.295" font-family="'Segoe UI'">Service reachable &amp; responds &lt;= 30s?</text><text x="2647.621" y="950.722" fill="#1E293B" font-size="22.917" textLength="179.506" font-family="'Segoe UI'">Yes [Main Flow]</text><text x="3367.422" y="950.722" fill="#1E293B" font-size="22.917" textLength="367.405" font-family="'Segoe UI'">No [E2: Timeout > 30s / Offline]</text><rect x="2306.29" y="1022.794" width="745.524" height="99.87" fill="#F1F5F9" style="stroke:#1F3A5F;stroke