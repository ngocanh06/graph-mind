[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/app/tests/unit backend/app/tests/integration
norecursedirs = scripts backups legacy staging_isolated .git node_modules
addopts = 
    --allow-hosts=127.0.0.1
    --allow-unix-socket 
    -m "not staging and not legacy_runtime"
    --ignore=backend/app/tests/test_copilot_pin_session.py 
    --ignore=backend/app/tests/test_copilot_postgres.py 
    --ignore=backend/app/tests/test_department_report.py 
    --ignore=backend/app/tests/test_department_scope.py 
    --ignore=backend/app/tests/test_sop_api.py 
    --ignore=backend/app/tests/test_user_admin_api.py

markers =
    unit: Fast in-memory unit tests with zero network and zero database
    integration: Mocked API and controller integration tests
    staging: Tests requiring isolated staging containers (disabled by default)
    legacy_runtime: Unquarantined tests connecting to live runtime databases
