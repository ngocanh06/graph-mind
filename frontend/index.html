    <meta name="description" content="GraphMind EKMP — Enterprise Knowledge Intelligence Platform powered by Hybrid GraphRAG for decision support and knowledge management." />
    <title>GraphMind — Enterprise Knowledge Intelligence Platform</title>
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="alternate icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans (enterprise SaaS, UI/UX Pro Max) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      body { background: #f8fafc; }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.6);
      }
    </style>

              "focus-danger": "0 0 0 3px rgba(220,38,38,0.18)",
            },
            animation: {
              "fade-in": "gm_fadeIn 0.2s ease-out",
              "slide-up": "gm_slideUp 0.22s ease-out",
              "pulse-soft": "gm_pulseSoft 2s ease-in-out infinite",
            },
            keyframes: {
              gm_fadeIn: { from: { opacity: "0", transform: "translateY(-4px)" }, to: { opacity: "1", transform: "translateY(0)" } },
              gm_slideUp: { from: { opacity: "0", transform: "translateY(8px)" }, to: { opacity: "1", transform: "translateY(0)" } },
              gm_pulseSoft: { "0%,100%": { opacity: "1" }, "50%": { opacity: "0.6" } },
            },

  <body class="antialiased">
    <div id="root"></div>
