<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" width="100%" height="100%">
  <defs>
    <!-- Gradient Cyan Neon phát sáng cao cấp -->
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>

    <!-- Gradient cho các điểm nút Nodes -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Hiệu ứng Đổ bóng & Phát sáng Neon -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Nền Xanh Đen Navy -->
  <rect width="560" height="130" rx="18" fill="#0B132B"/>

  <!-- KHỐI BIỂU TƯỢNG GM MONOGRAM -->
  <g transform="translate(30, 20)">
    <!-- Khối khung mờ hậu cảnh -->
    <rect x="0" y="0" width="90" height="90" rx="22" fill="#00E5FF" opacity="0.12" stroke="#00E5FF" stroke-width="1.5" />

    <!-- Nét chữ G (Graph) uốn ngoài -->
    <path d="M 68,28 C 58,16 34,16 22,30 C 10,44 10,64 22,76 C 34,88 58,88 70,76 C 76,70 78,60 78,50 L 48,50 L 48,68 L 58,68 L 58,58 L 68,58 L 68,70 L 78,50" 
          fill="none" stroke="url(#gmGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- Nét chữ M (Mind) lồng bên trong -->
    <path d="M 32,68 L 32,42 L 44,56 L 56,42 L 56,68" 
          fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- Các điểm nút Đồ thị (Graph Nodes) -->
    <circle cx="22" cy="30" r="4.5" fill="url(#nodeGrad)" />
    <circle cx="22" cy="76" r="4.5" fill="url(#nodeGrad)" />
    <circle cx="68" cy="28" r="4.5" fill="url(#nodeGrad)" />
    <circle cx="44" cy="56" r="4.5" fill="url(#nodeGrad)" />
  </g>

  <!-- TÊN THƯƠNG HIỆU -->
  <text x="145" y="68" font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="1.5">
    <tspan fill="#FFFFFF">GRAPH</tspan>
    <tspan fill="#00E5FF">MIND</tspan>
  </text>

  <!-- TAGLINE PHỤ -->
  <text x="147" y="94" font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12.5" fill="#00E5FF" letter-spacing="3.5" opacity="0.85">
    KNOWLEDGE GRAPH &amp; AI SOLUTION
  </text>
</svg>
