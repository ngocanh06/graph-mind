services:
  # ============================================================================
  # NEO4J GRAPH DATABASE
  # ============================================================================
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j_db
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/graphmind_secret
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphmind-net

  # ============================================================================
  # QDRANT VECTOR DATABASE
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - graphmind-net

  # ============================================================================
  # GRAPHMIND FASTAPI BACKEND
  # Shares /data with File Watcher for central document storage
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphmind_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - WATCH_ROOT=/data
      - CENTRAL_STORAGE_DIR=/data
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphmind_secret
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION_NAME=cuad_contracts
      - POSTGRES_SERVER=host.docker.internal
      - AEGIS_AGENT_API_KEY=dev-agent-key
      - PYTHONUNBUFFERED=1
    volumes:
      - graphmind_documents:/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - graphmind-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # GRAPHMIND FRONTEND DASHBOARD
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: graphmind_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - graphmind-net

  # ============================================================================
  # AEGIS FILE WATCHER DAEMON (DOCKER VOLUME STORAGE)
  # Monitors /data on Docker Named Volume graphmind_documents
  # Transmits CREATE / MODIFY / DELETE / RENAME events to Backend via Webhook
  # ============================================================================
  file-watcher:
    build:
      context: ./aegis-agent
      dockerfile: Dockerfile
    container_name: aegis_file_watcher
    restart: unless-stopped
    environment:
      - WATCH_ROOT=/data
      - AEGIS_BACKEND_URL=http://backend:5000
      - AEGIS_BACKEND_FALLBACK_URL=http://host.docker.internal:5000
      - AEGIS_AGENT_API_KEY=dev-agent-key
      - AGENT_API_KEY=dev-agent-key
      - PYTHONUNBUFFERED=1
    volumes:
      - graphmind_documents:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - neo4j
    networks:
      - graphmind-net

# ============================================================================
# PERSISTENT VOLUMES
# Storage separation:
#   1. graphmind_documents: Dedicated named volume for raw monitored documents (/data)
#   2. qdrant_data: Vector database storage (isolated in ./qdrant_data)
#   3. neo4j_data: Graph database property store (isolated in ./neo4j_data)
# ============================================================================
volumes:
  graphmind_documents:
    name: graph-mind_graphmind_documents

networks:
  graphmind-net:
    driver: bridge
