version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graphmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphmind_secret}
      POSTGRES_DB: ${POSTGRES_DB:-graphmind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.20-community
    container_name: graphmind_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-graphmind_secret}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: graphmind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
