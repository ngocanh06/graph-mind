name: graphmind-robot

x-backend-environment: &backend-environment
  APP_ENV: testing
  SECRET_KEY: robot-only-secret-change-before-use
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: robot
  POSTGRES_PASSWORD: robot-only-db-password
  POSTGRES_DB: graph_mind_robot
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: robot-only-neo4j-password
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_COLLECTION_NAME: robot_test_collection
  INFERENCE_ENGINE_URL: http://host.docker.internal:11434
  ROBOT_TEST_PASSWORD: robot-test-only-123

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot-only-db-password
      POSTGRES_DB: graph_mind_robot
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d graph_mind_robot"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.18.0
    environment:
      NEO4J_AUTH: neo4j/robot-only-neo4j-password
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/7687"]
      interval: 10s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.8.2
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:15000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://127.0.0.1:15000/api
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      backend:
        condition: service_healthy

  seed-test-users:
    profiles: ["seed"]
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - ./tests/robot:/tests/robot:ro
    command: ["python", "/tests/robot/seed_staging.py"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
    name: graphmind_robot_postgres_data
  neo4j-data:
    name: graphmind_robot_neo4j_data
  qdrant-data:
    name: graphmind_robot_qdrant_data
